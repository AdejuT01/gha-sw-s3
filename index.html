<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My AWS Static Website</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #4facfe, #00f2fe);
      color: white;
      text-align: center;
    }

    .container {
      margin-top: 120px;
      padding: 40px;
    }

    h1 {
      font-size: 48px;
      margin-bottom: 10px;
    }

    p {
      font-size: 20px;
    }

    .card {
      background-color: white;
      color: #333;
      width: 60%;
      max-width: 600px;
      margin: 30px auto;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
    }

    .button {
      display: inline-block;
      margin-top: 15px;
      padding: 12px 25px;
      background-color: #ff7a59;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }

    .button:hover {
      background-color: #ff5733;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Welcome to My AWS Website 🚀</h1>

    <p>This website is hosted on Amazon S3.</p>

    <div class="card">
      <h2>My DevOps Project</h2>

      <p>
        I deployed this static website using AWS S3
        as part of my Cloud and DevOps learning journey.
      </p>

      <a href="https://aws.amazon.com/" class="button">
        Learn About AWS
      </a>
    </div>

  </div>

</body>
</html>
